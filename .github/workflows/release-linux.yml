name: Release Linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the Linux build to (e.g. v1.13.0)'
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - run: flutter build linux --release

      - run: linux/packaging/package.sh "${TAG#v}"

      - run: gh release upload "$TAG" build/linux/dist/* --clobber
