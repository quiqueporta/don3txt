name: don3txt
description: "Todo.txt task manager for Android"
publish_to: 'none'
version: 1.14.0

environment:
  sdk: ^3.13.0
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.0
  path_provider: ^2.1.0
  google_fonts: ^9.0.0
  shared_preferences: ^2.2.0
  file_picker: ^13.1.0
  permission_handler: ^13.0.2
  url_launcher: ^6.3.2
  material_ui: ^1.7.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
